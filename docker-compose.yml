version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: handbag-store-db
    environment:
      POSTGRES_DB: handbag_store
      POSTGRES_USER: handbag_user
      POSTGRES_PASSWORD: handbag_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: