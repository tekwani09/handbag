name: Deploy to EC2

on:
  push:
    branches: [ clean-main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json
    
    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npx vite build
    
    - name: Build Backend
      run: |
        cd backend
        npm ci
        npm run build
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 23.22.136.44
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        timeout: 300s
        command_timeout: 60s
        script: |
          set -e
          cd /home/ec2-user/handbag-store || exit 1
          git fetch origin clean-main
          git reset --hard origin/clean-main
          
          # Quick backend restart
          cd backend
          npm ci --production
          npm run build
          pm2 restart handbag-backend || pm2 start dist/index.js --name handbag-backend
          
          # Quick frontend restart  
          cd ../frontend
          npm ci --production
          npm run build
          pm2 restart handbag-frontend || pm2 serve dist 3000 --name handbag-frontend
          
          echo "✅ Deployment completed!"